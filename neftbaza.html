/* =========================================================
   NEFTBAZA PRO — avtomatlashtirilgan prototip (frontend-only)
   Manba: yuklangan Excel dasturi (Этап / sheets) asosida qurilgan.
   Ma'lumotlar window.storage orqali brauzerda saqlanadi (shaxsiy).
   ========================================================= */


/* ---------------- confirmation dialog ---------------- */
let CONFIRM_CALLBACK = null;
function askConfirm(message, callback){
  CONFIRM_CALLBACK = callback;
  const msgEl = $('#confirmMsg');
  if(msgEl) msgEl.textContent = message;
  $('#confirmOverlay').style.display = 'flex';
}
function closeConfirm(){
  CONFIRM_CALLBACK = null;
  $('#confirmOverlay').style.display = 'none';
}
function confirmYes(){
  const cb = CONFIRM_CALLBACK;
  closeConfirm();
  if(cb) cb();
}
function confirmDeleteDoc(docType, id){
  askConfirm("Bu hujjatni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.", function(){ deleteDoc(docType, id); });
}
function confirmDeleteProizvodstvo(id){
  askConfirm("Bu hujjatni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.", function(){ deleteProizvodstvo(id); });
}
function confirmRemoveRef(idx){
  askConfirm("Bu elementni o'chirmoqchimisiz?", function(){ removeRef(idx); });
}


















</script>

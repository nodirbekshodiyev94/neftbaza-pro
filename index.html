<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEFTBAZA PRO — Boshqaruv tizimi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D1417;
  --bg2:#0A0F12;
  --panel:#151E23;
  --panel2:#1B262C;
  --panel3:#212E35;
  --border:#28363E;
  --border-soft:#1E2A30;
  --text:#E9F1F3;
  --text-dim:#8FA5AC;
  --text-faint:#5C7178;
  --accent:#E8A33D;
  --accent-dim:#3A2E18;
  --accent2:#43B3A6;
  --accent2-dim:#173230;
  --danger:#E2574C;
  --danger-dim:#3A1D1A;
  --success:#4CAF6D;
  --success-dim:#173423;
  --info:#5AA0E0;
  --info-dim:#152A3C;
  --mo-grid:#5A6A72;
  --radius:10px;
  --radius-sm:6px;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --shadow-soft:0 8px 24px -6px rgba(0,0,0,.5);
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg:#F5F7FA;
  --bg2:#EAEDF2;
  --panel:#FFFFFF;
  --panel2:#F8F9FB;
  --panel3:#EFF2F6;
  --border:#DCE1E8;
  --border-soft:#E7EAEF;
  --text:#1B2430;
  --text-dim:#5B6672;
  --text-faint:#8B96A1;
  --accent:#C97A1E;
  --accent-dim:#FBEACB;
  --accent2:#2C8478;
  --accent2-dim:#DEF0EC;
  --danger:#C13B31;
  --danger-dim:#FBE1DD;
  --success:#2E8B4F;
  --success-dim:#DFF3E5;
  --info:#2563EB;
  --info-dim:#EAF2FB;
  --mo-grid:#1F2730;
  --shadow-soft:0 8px 24px -6px rgba(18,33,51,.12);
  color-scheme: light;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(44,132,120,.05), transparent),
    radial-gradient(1000px 500px at -10% 110%, rgba(201,122,30,.05), transparent),
    var(--bg);
}
html[data-theme="light"] #sidebar{
  --bg2:#0F1C2E; --panel:#16233A; --panel2:#1B2A40; --panel3:#20304A;
  --border:#2C3E58; --border-soft:#1C2A40;
  --text:#E9F1F3; --text-dim:#8FA5AC; --text-faint:#61798A;
  background:linear-gradient(180deg,#16233A,#0E1928 85%);
  border-right-color:rgba(255,255,255,.05);
}
html[data-theme="light"] table.datatable tbody tr:hover{ background:var(--panel3); }
html[data-theme="light"] .toastmsg{ box-shadow:var(--shadow-soft); }
html[data-theme="light"] #topbar{ background:rgba(245,247,250,.86); }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(67,179,166,.05), transparent),
    radial-gradient(1000px 500px at -10% 110%, rgba(232,163,61,.05), transparent),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
::selection{background:var(--accent);color:#1a1206;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}

/* ---------- layout shell ---------- */
#shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh;}
#sidebar{
  background:linear-gradient(180deg,var(--bg2),#090D0F 85%);
  border-right:1px solid var(--border-soft);
  padding:0 0 24px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;
}
#brand{
  padding:22px 20px 18px;
  border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;gap:11px;
}
#brand .mark{
  width:36px;height:36px;border-radius:50%;
  background:#0D2B45;
  border:2px solid #030608;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;overflow:hidden;
  box-shadow:0 4px 14px -4px rgba(0,0,0,.6);
}
#brand .name{font-family:var(--font-display);font-weight:600;font-size:16.5px;letter-spacing:.5px;line-height:1.15;color:var(--text);}
#brand .name small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--text-faint);letter-spacing:1.5px;margin-top:2px;}

nav.navgroup{padding:14px 12px 4px;}
nav.navgroup .grouplabel{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1.8px;color:var(--text-faint);
  padding:10px 10px 6px;text-transform:uppercase;
}
/* --- Asosiy menyu (single elementlar + accordion parent bir xil ko'rinishda) --- */
nav.navgroup a.navitem,
.navparent{
  width:100%;display:flex;align-items:center;gap:10px;
  padding:9.5px 11px;margin:2px 0;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13.4px;font-weight:500;font-family:inherit;
  letter-spacing:0;text-transform:none;
  border-left:2px solid transparent;background:transparent;cursor:pointer;
  transition:background .14s, color .14s;
}
nav.navgroup a.navitem .ic,.navparent .ic{width:18px;text-align:center;font-size:14px;opacity:.85;flex-shrink:0;}
nav.navgroup a.navitem:hover,.navparent:hover{background:var(--panel);color:var(--text);}
/* aktiv/ochiq asosiy menyu — orange (mavjud sxema) */
nav.navgroup a.navitem.active,
.navparent.open{
  background:linear-gradient(90deg, rgba(232,163,61,.16), rgba(232,163,61,.02));
  color:var(--accent);border-left:2px solid var(--accent);font-weight:600;
}
nav.navgroup a.navitem.active .ic,.navparent.open .ic{opacity:1;color:var(--accent);}
.navdivider{height:1px;background:var(--border-soft);margin:10px 18px;}

.navparent-label{flex:1;text-align:left;}
.navparent .chevron{font-size:14px;transition:transform .24s ease-in-out;opacity:.6;}
.navparent.open .chevron{transform:rotate(90deg);opacity:1;}

/* --- Ochiladigan submenu: alohida ichkariga surilgan blok --- */
.navchildren{display:grid;grid-template-rows:0fr;transition:grid-template-rows .26s ease-in-out;}
.navchildren.open{grid-template-rows:1fr;}
.navchildren-inner{
  overflow:hidden;
  margin:8px 6px 8px 15px;                       /* parentdan oraliq + indent (hierarchy) */
  padding:6px 6px 6px 16px;                      /* ichki padding + guide line uchun joy */
  background:var(--submenu-bg,rgba(148,163,184,.06));
  border:1px solid var(--border-soft);border-radius:10px;position:relative;
  opacity:0;transform:translateY(-4px);
  transition:opacity .26s ease-in-out, transform .26s ease-in-out;
}
.navchildren.open .navchildren-inner{opacity:1;transform:none;}
.navchildren-inner::before{                      /* chap tomonda vertikal yo'naltiruvchi chiziq */
  content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;
  background:var(--border);border-radius:2px;
}
/* --- Submenu elementlari (kichikroq, regular) --- */
a.navitem.sub{
  position:relative;display:flex;align-items:center;gap:9px;
  padding:7px 11px;margin:3px 0;border-radius:8px;border-left:none;
  font-size:12.5px;font-weight:400;color:var(--text-dim);
  transition:background .12s,color .12s;
}
a.navitem.sub .ic{width:15px;text-align:center;font-size:12.5px;opacity:.7;flex-shrink:0;}
a.navitem.sub:hover{background:var(--panel);color:var(--text);}
a.navitem.sub:hover .ic{opacity:.95;}
/* aktiv submenu — yashil matn + guide segmenti yashil + o'ngda yashil nuqta */
a.navitem.sub.active{color:var(--success);font-weight:600;background:rgba(76,175,109,.10);}
a.navitem.sub.active .ic{opacity:1;color:var(--success);}
a.navitem.sub.active::before{
  content:"";position:absolute;left:-8px;top:4px;bottom:4px;width:2px;
  background:var(--success);border-radius:2px;
}
a.navitem.sub.active::after{
  content:"";margin-left:auto;width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--success);box-shadow:0 0 0 3px rgba(76,175,109,.18);
}
html[data-theme="light"] .navchildren-inner{background:rgba(15,23,42,.035);}

#sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border-soft);}
#clock{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;}
#clock b{color:var(--accent2);font-weight:500;}

/* ---------- main ---------- */
#main{min-width:0;}
#topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(13,20,23,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
  padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
#topbar h1{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.3px;margin:0;display:flex;align-items:center;gap:10px;}
#topbar .crumb{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:3px;letter-spacing:.5px;}
#topbar .actions{display:flex;gap:8px;align-items:center;}
#menubtn{display:none;}

#content{padding:26px 30px 60px;max-width:1400px;}

/* ---------- cards / grid ---------- */
.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:20px;}
.card + .card{margin-top:18px;}
.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.cardhead h2{font-family:var(--font-display);font-size:15.5px;font-weight:600;letter-spacing:.4px;margin:0;color:var(--text);text-transform:uppercase;}
.cardhead .sub{font-size:12px;color:var(--text-faint);margin-top:3px;}

.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.stat{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:17px 18px;position:relative;overflow:hidden;}
.stat .lbl{font-size:11.5px;color:var(--text-faint);letter-spacing:.4px;text-transform:uppercase;font-family:var(--font-mono);}
.stat .val{font-family:var(--font-mono);font-size:26px;font-weight:600;margin-top:6px;color:var(--text);}
.stat .val small{font-size:13px;color:var(--text-dim);font-weight:400;margin-left:3px;}
.stat .bar{height:3px;border-radius:2px;background:var(--border);margin-top:12px;overflow:hidden;}
.stat .bar i{display:block;height:100%;background:var(--accent);}
.stat.in .bar i{background:var(--accent2);}
.stat.out .bar i{background:var(--danger);}

/* ---------- reservoir gauges ---------- */
.tankrow{display:flex;gap:22px;flex-wrap:wrap;padding:6px 2px 4px;}
.tank{width:108px;text-align:center;flex-shrink:0;}
.tank .cyl{
  width:74px;height:150px;margin:0 auto;border-radius:10px 10px 6px 6px;
  border:2px solid var(--border);background:
    linear-gradient(180deg, rgba(255,255,255,.03), transparent 30%),
    var(--bg2);
  position:relative;overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
}
.tank .cyl .fill{
  position:absolute;bottom:0;left:0;right:0;height:0%;
  background:linear-gradient(180deg, var(--fc2,#5CCBBD), var(--fc1,#2C8478));
  transition:height 1.1s cubic-bezier(.2,.8,.2,1);
}
.tank .cyl .fill::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:rgba(255,255,255,.22);
}
.tank .cyl .ticks{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:4px 0;pointer-events:none;}
.tank .cyl .ticks i{display:block;height:1px;background:rgba(255,255,255,.06);}
.tank .name{font-family:var(--font-mono);font-size:11.5px;margin-top:9px;color:var(--text);font-weight:500;}
.tank .base{font-size:10px;color:var(--text-faint);}
.tank .pct{font-family:var(--font-mono);font-size:13px;margin-top:2px;font-weight:600;}
.tank .qty{font-size:10px;color:var(--text-dim);font-family:var(--font-mono);}

/* ---------- forms ---------- */
.formsection{margin-bottom:18px;}
.formsection .fstitle{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:1.3px;font-weight:600;
  color:var(--accent2);text-transform:uppercase;
  margin-bottom:14px;padding:8px 14px;
  background:var(--accent2-dim);
  border-left:3px solid var(--accent2);
  border-radius:0 6px 6px 0;
  display:inline-block;
}
.formsection .fstitle-doc{color:var(--accent);background:var(--accent-dim);border-left-color:var(--accent);}
.formsection .fstitle-fact{color:var(--success);background:var(--success-dim);border-left-color:var(--success);}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.wide{grid-column:1/-1;}
.field label{font-size:11.5px;color:var(--text-dim);font-weight:500;}
.field label .req{color:var(--danger);}
.field input,.field select,.field textarea{
  background:var(--panel3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8.5px 10px;color:var(--text);font-size:13px;outline:none;
  transition:border-color .12s, background .12s;
  font-family:var(--font-body);
  width:100%;
}
.field input[type=number],.field input[type=date]{font-family:var(--font-mono);}
.field input::placeholder{color:var(--text-faint);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2);background:var(--panel2);}
.field textarea{resize:vertical;min-height:56px;}
.field .hint{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
.field .hint.live{color:var(--accent2);}

.formfoot{display:flex;gap:10px;margin-top:6px;align-items:center;}
.btn{
  border:1px solid var(--border);background:var(--panel3);color:var(--text);
  padding:9.5px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:all .12s;letter-spacing:.2px;
}
.btn:hover{border-color:var(--text-faint);background:var(--panel2);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1D1305;}
.btn.primary:hover{background:#F0AE4E;box-shadow:0 4px 14px -4px rgba(232,163,61,.5);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--danger);border-color:var(--danger-dim);}
.btn.danger:hover{background:var(--danger-dim);}
.btn.sm{padding:6px 11px;font-size:12px;}
.btn.icon{padding:7px 9px;}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border-soft);}
table.datatable{width:100%;border-collapse:collapse;font-size:12.7px;min-width:640px;}
table.datatable thead th{
  background:var(--panel3);color:var(--text-dim);text-align:left;padding:10px 12px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
  border-right:1px solid var(--border-soft);
}
/* ---- Moddiy hisobot jadvali: 1C/Excel uslubidagi zich yorug' hisobot ---- */
table.mo-table{
  background:#fff;color:#111827;border:1px solid #D1D5DB;
  font-family:var(--font-body,'Inter',sans-serif);font-variant-numeric:tabular-nums;font-size:12px;
}
table.mo-table th, table.mo-table td{border:1px solid #D1D5DB !important;}
table.mo-table thead th{
  text-align:center;text-transform:none;font-weight:600;color:#1F2937;
  font-size:11px;line-height:1.18;white-space:normal;vertical-align:middle;padding:4px 7px;
  background:#F7EFD5;
}
table.mo-table thead th[rowspan="2"]{background:#F7EFD5;color:#1F2937;}
table.mo-table .mo-grp-in{background:#EAF7EA;color:#137333;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.4px;padding:4px;}
table.mo-table .mo-grp-out{background:#FBEAEA;color:#B0201A;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.4px;padding:4px;}
table.mo-table .mo-sub-in{background:#F4FBF4;color:#137333;font-weight:600;}
table.mo-table .mo-sub-out{background:#FFF4F4;color:#B0201A;font-weight:600;}
/* tana — zich, markazlangan qora raqamlar; KIRIM yashil, CHIQIM qizil */
table.mo-table tbody td{padding:2px 8px;height:26px;color:#111827;background:#fff;text-align:center;white-space:nowrap;font-family:inherit;}
table.mo-table .num{font-family:inherit;}
table.mo-table tbody tr:nth-child(even){background:transparent;}
table.mo-table tbody tr:hover td{background:#F1F5F9;}
table.mo-table tbody td:first-child{text-align:center;color:#374151;font-weight:500;}
table.mo-table tbody td:nth-child(2){font-weight:600;text-align:left;color:#111827;}
table.mo-table tbody td.mo-in{color:#15803D;}
table.mo-table tbody td.mo-out{color:#C81E1E;}
/* JAMI (tfoot) — bir xil qoida */
table.mo-table tfoot td{background:#F3F4F6;font-weight:700;color:#111827;border-top:2px solid #9CA3AF !important;text-align:center;padding:3px 8px;height:28px;font-family:inherit;}
table.mo-table tfoot td:first-child{text-align:left;}
table.mo-table tfoot td.mo-in{color:#15803D;}
table.mo-table tfoot td.mo-out{color:#C81E1E;}
/* moddiy hisobot qatori — ikki marta bosiladigan */
table.mo-table tbody tr.mo-row{cursor:pointer;}
table.mo-table tbody tr.mo-row:hover td{background:#EEF3FA;}

/* ---- Harakatlar tarixi modali ---- */
.mvh-overlay{position:fixed;inset:0;z-index:400;background:rgba(6,9,11,.62);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadein .15s ease-out;}
.mvh-modal{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:1180px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -16px rgba(0,0,0,.6);animation:popin .18s cubic-bezier(.2,.8,.2,1);overflow:hidden;}
.mvh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.mvh-title{display:flex;align-items:center;gap:9px;font-family:var(--font-display,'Oswald',sans-serif);font-size:16px;font-weight:600;color:var(--text);}
.mvh-title svg{width:18px;height:18px;}
.mvh-x{background:var(--panel3);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.mvh-x:hover{color:var(--text);border-color:var(--accent2);}
.mvh-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--panel3);}
.mvh-f{display:flex;flex-direction:column;gap:5px;min-width:130px;}
.mvh-f.mvh-search{flex:1 1 200px;min-width:180px;}
.mvh-f label{font-size:11px;color:var(--text-dim);font-weight:500;}
.mvh-f input,.mvh-f select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
.mvh-f input:focus,.mvh-f select:focus{border-color:var(--accent2);}
.mvh-tablewrap{overflow:auto;flex:1;}
table.mvh-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;}
table.mvh-table thead th{position:sticky;top:0;z-index:2;background:var(--panel3);color:var(--text-dim);font-weight:600;font-size:11.5px;text-align:center;padding:8px 9px;white-space:nowrap;border-bottom:1px solid var(--border);}
table.mvh-table tbody td{padding:7px 9px;border-bottom:1px solid var(--border-soft);color:var(--text);white-space:nowrap;text-align:center;}
table.mvh-table tbody td:last-child,table.mvh-table tbody td:nth-child(5),table.mvh-table tbody td:nth-child(6){text-align:left;}
table.mvh-table tbody tr:hover td{background:var(--panel);}
table.mvh-table .num{font-family:var(--font-mono);text-align:right;}
.mvh-op{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;letter-spacing:.3px;}
.mvh-op.in{background:var(--accent2-dim);color:var(--accent2);}
.mvh-op.out{background:var(--danger-dim);color:var(--danger);}
.mvh-pos{color:var(--success);}
.mvh-neg{color:var(--danger);}
.mvh-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 20px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-dim);flex-wrap:wrap;}
.mvh-foot .mvh-hint{color:var(--text-faint);}

/* ---- Moddiy hisobot: to'liq oyna rejimi ---- */
.mo-report-bar{display:none;}
.mo-report-bar-title{display:flex;align-items:center;gap:8px;font-weight:700;color:#1F2937;font-size:14px;}
.mo-report-bar-title svg{width:17px;height:17px;}
#moReportCard.mo-fs{position:fixed;inset:0;z-index:390;margin:0;border-radius:0;background:#fff;display:flex;flex-direction:column;box-shadow:none;border:none;}
#moReportCard.mo-fs .mo-report-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 16px;border-bottom:1px solid #D1D5DB;background:#F7EFD5;flex:0 0 auto;}
#moReportCard.mo-fs .tablewrap{flex:1 1 auto;overflow:auto;border:none;border-radius:0;}
#moReportCard.mo-fs table.mo-table{border-top:none;}
/* to'liq oynada — yopishqoq ikki qavatli sarlavha */
#moReportCard.mo-fs table.mo-table thead tr:first-child th{position:sticky;top:0;z-index:6;}
#moReportCard.mo-fs table.mo-table thead tr:nth-child(2) th{position:sticky;top:var(--mo-subtop,26px);z-index:6;}
#moReportCard.mo-fs table.mo-table tfoot td{position:sticky;bottom:0;z-index:5;}

/* ---- Moddiy hisobot: dizayn ---- */
.mo-card{box-shadow:var(--shadow-soft);background:#fff;border:1px solid #D1D5DB;}
.mo-card .tablewrap{border:none;border-radius:8px;background:#fff;}
.btn.success{background:var(--success);border-color:var(--success);color:#fff;}
.btn.success:hover{background:var(--success);filter:brightness(1.07);box-shadow:0 4px 14px -4px rgba(46,139,79,.5);}
.mo-filter{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.mo-filter .field{flex:1 1 165px;min-width:145px;max-width:240px;gap:6px;}
.mo-filter .field input,.mo-filter .field select{background:var(--panel);}
.mo-filter .mo-clear{align-self:flex-end;}
.mo-actions{margin-left:auto;display:grid;grid-template-columns:repeat(2,minmax(155px,1fr));gap:10px;align-content:end;}
.mo-actions .btn{justify-content:center;width:100%;}
.btn-ico{width:17px;height:17px;flex:0 0 auto;display:inline-block;vertical-align:middle;}
@media(max-width:760px){ .mo-actions{margin-left:0;width:100%;} }
table.datatable thead th:last-child{border-right:none;}
table.datatable tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);color:var(--text);white-space:nowrap;border-right:1px solid var(--border-soft);}
table.datatable tbody td:last-child{border-right:none;}
table.datatable tbody tr:hover{background:var(--panel2);}
table.datatable tbody tr:last-child td{border-bottom:none;}
table.datatable .num{font-family:var(--font-mono);text-align:right;}
table.datatable .pos{color:var(--success);}
table.datatable .neg{color:var(--danger);}
table.datatable tfoot td{padding:10px 12px;font-family:var(--font-mono);font-weight:600;background:var(--panel3);border-top:1px solid var(--border);}
.emptyrow td{text-align:center;color:var(--text-faint);padding:26px;font-style:normal;}
.tag{display:inline-flex;align-items:center;padding:2.5px 8px;border-radius:20px;font-size:10.5px;font-family:var(--font-mono);font-weight:500;letter-spacing:.3px;}
.tag.in{background:var(--accent2-dim);color:var(--accent2);}
.tag.out{background:var(--danger-dim);color:var(--danger);}
.tag.mid{background:var(--accent-dim);color:var(--accent);}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.filterbar .field{min-width:150px;flex:0 0 auto;}

.toolbar-btns{display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  padding:6px 13px;border-radius:20px;font-size:12px;border:1px solid var(--border);
  background:var(--panel3);color:var(--text-dim);font-weight:500;
}
.pill.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}

/* toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}

.auth-overlay{
  position:fixed;inset:0;z-index:500;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(67,179,166,.08), transparent),
    radial-gradient(1000px 500px at -10% 110%, rgba(232,163,61,.08), transparent),
    #0A0F12;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-body,'Inter',sans-serif);
}
.auth-box{
  background:var(--panel,#151E23);border:1px solid var(--border,#28363E);border-radius:14px;
  padding:36px 34px 30px;width:100%;max-width:380px;
  box-shadow:0 24px 60px -16px rgba(0,0,0,.6);
  animation:popin .2s cubic-bezier(.2,.8,.2,1);
}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.auth-logo .mark{width:52px;height:52px;}
.auth-logo .name{font-family:var(--font-display,'Oswald',sans-serif);font-weight:600;font-size:19px;color:var(--text,#E9F1F3);letter-spacing:.5px;}
.auth-logo .name small{display:block;font-family:var(--font-mono,monospace);font-size:10px;color:var(--text-faint,#5C7178);letter-spacing:1.5px;font-weight:400;margin-top:3px;text-align:center;}
.auth-role-row{display:flex;gap:12px;margin-top:8px;}
.auth-role-btn{
  flex:1;padding:20px 12px;border-radius:10px;border:1px solid var(--border,#28363E);
  background:var(--panel3,#212E35);color:var(--text-dim,#8FA5AC);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;
  transition:all .15s;
}
.auth-role-btn .ic{font-size:26px;}
.auth-role-btn:hover{border-color:var(--accent2,#43B3A6);color:var(--text,#E9F1F3);background:var(--panel2,#1B262C);}
.auth-title{text-align:center;color:var(--text,#E9F1F3);font-family:var(--font-display,'Oswald',sans-serif);font-size:16px;font-weight:600;margin-bottom:4px;}
.auth-sub{text-align:center;color:var(--text-faint,#5C7178);font-size:12px;margin-bottom:20px;}
.auth-field{margin-bottom:14px;}
.auth-field label{display:block;font-size:12px;color:var(--text-dim,#8FA5AC);margin-bottom:6px;font-weight:500;}
.auth-field input{
  width:100%;background:var(--panel3,#212E35);border:1px solid var(--border,#28363E);border-radius:8px;
  padding:10px 12px;color:var(--text,#E9F1F3);font-size:14px;outline:none;font-family:var(--font-body,'Inter',sans-serif);
}
.auth-field input:focus{border-color:var(--accent2,#43B3A6);}
.auth-error{color:var(--danger,#E2574C);font-size:12.5px;text-align:center;margin:-6px 0 12px;min-height:16px;}
.auth-back{display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--text-faint,#5C7178);cursor:pointer;background:none;border:none;width:100%;}
.auth-back:hover{color:var(--text-dim,#8FA5AC);}
.role-badge{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;
  font-size:11px;font-weight:600;font-family:var(--font-mono);letter-spacing:.4px;
  background:var(--accent-dim);color:var(--accent);
}
.role-badge.admin{background:var(--accent-dim);color:var(--accent);}
.role-badge.user{background:var(--accent2-dim);color:var(--accent2);}
.role-badge.guest{background:var(--panel3);color:var(--text-dim);}

.modal-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(6,9,11,.6);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  animation:fadein .15s ease-out;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal-box{
  background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);
  padding:26px 26px 20px;max-width:340px;width:90%;text-align:center;
  box-shadow:0 20px 50px -12px rgba(0,0,0,.6);
  animation:popin .18s cubic-bezier(.2,.8,.2,1);
}
@keyframes popin{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-icon{font-size:30px;margin-bottom:8px;}
.modal-title{font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px;}
.modal-msg{font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:20px;}
.modal-actions{display:flex;gap:10px;justify-content:center;}
.modal-actions .btn{flex:1;justify-content:center;}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#2A0705;}
.btn.solid-danger:hover{background:#EB6B60;}
.toastmsg{
  background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--accent2);
  padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;box-shadow:0 8px 24px -6px rgba(0,0,0,.5);
  animation:slidein .25s ease-out;max-width:300px;
}
.toastmsg.danger{border-left-color:var(--danger);}
@keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* refs page */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border-soft);padding-bottom:14px;}
.tabbtn{padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:500;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);}
.tabbtn.active{background:var(--accent);border-color:var(--accent);color:#1D1305;font-weight:600;}

.itemsrow{display:grid;grid-template-columns:1.3fr 0.8fr 0.9fr 0.9fr 0.9fr auto;gap:8px;align-items:end;margin-bottom:8px;}
.prod-sum-row{
  display:grid;grid-template-columns:1.3fr 0.8fr 0.9fr 0.9fr 0.9fr auto;gap:8px;align-items:center;
  margin:2px 0 10px;padding:9px 10px;border-radius:var(--radius-sm);
  background:var(--accent2-dim);border:1px solid var(--accent2);
}
.prod-sum-row .sum-lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.5px;color:var(--accent2);text-transform:uppercase;}
.prod-sum-row .sum-val{font-weight:700;color:var(--accent2);font-size:14px;}
.prod-sum-row small{font-weight:500;opacity:.75;margin-left:3px;font-size:10.5px;color:var(--accent2);}
.itemtable-title{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin:14px 0 8px;}
.prod-comp-box{
  background:var(--panel3);border:1px dashed var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;margin:-4px 0 14px;
}
.prod-comp-title{font-family:var(--font-mono);font-size:10.5px;color:var(--accent2);letter-spacing:.5px;margin-bottom:9px;}
.prod-comp-row{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-bottom:6px;align-items:center;}
.prod-comp-row select,.prod-comp-row input{
  background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12.5px;
}
.prod-comp-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:10px;flex-wrap:wrap;}
.prod-comp-total{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);}
.prod-comp-total span{color:var(--accent2);font-weight:600;}

.empty-illustration{text-align:center;padding:50px 20px;color:var(--text-faint);}
.empty-illustration .big{font-size:36px;margin-bottom:10px;opacity:.5;}

.dashgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:1100px){.dashgrid{grid-template-columns:1fr;}}

.badge-num{background:var(--panel3);border-radius:5px;padding:1px 7px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}

@media print{
  body.printing-report #shell, body.printing-report #authOverlay, body.printing-report #toast, body.printing-report #confirmOverlay{ display:none !important; }
  body.printing-report #printReportArea{ display:block !important; }
  body:not(.printing-report) #printReportArea{ display:none !important; }
}
@media(max-width:880px){
  #shell{grid-template-columns:1fr;}
  #sidebar{position:fixed;left:-270px;top:0;width:252px;z-index:100;transition:left .2s;box-shadow:20px 0 40px rgba(0,0,0,.4);}
  #sidebar.open{left:0;}
  #menubtn{display:inline-flex;}
  #content{padding:20px 16px 50px;}
  #topbar{padding:14px 16px;}
  .fieldgrid{grid-template-columns:1fr 1fr;}
}

/* ---------- SVG icon system (flat, currentColor, dark/light-safe) ---------- */
svg.icn{width:1em;height:1em;flex-shrink:0;vertical-align:-0.14em;stroke:currentColor;}

.btn.icon svg.icn{width:18px;height:18px;margin:0;vertical-align:0;}
.btn.sm svg.icn{margin-right:5px;}
.btn.sm.icon svg.icn{width:15px;height:15px;margin:0;}
.modal-icon{display:flex;justify-content:center;}

.empty-illustration .big{display:flex;justify-content:center;}
.empty-illustration .big svg.icn{width:44px;height:44px;}
.auth-role-btn .ic{display:flex;justify-content:center;}
.auth-role-btn .ic svg.icn{width:27px;height:27px;vertical-align:0;}
.role-badge svg.icn{width:13px;height:13px;margin-right:4px;vertical-align:-0.15em;}

.chevron svg.icn{width:16px;height:16px;vertical-align:middle;}
.tabbtn svg.icn{width:1em;height:1em;margin-right:6px;vertical-align:-0.14em;}
#brand .mark svg.brandglyph,.auth-logo .mark svg{width:100%;height:100%;display:block;}
</style>

<body>

        <button class="btn icon ghost" id="themebtn" title="Tun/kun rejimi" onclick="toggleTheme()"><svg class="icn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
        <button class="btn icon ghost" id="logoutbtn" title="Chiqish" onclick="confirmLogout()"><svg class="icn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg></button>
        <button class="btn icon ghost" id="menubtn"><svg class="icn" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

<script>
window.APP_LANG = 'uz';

<script id="app-core">
/* =========================================================
   NEFTBAZA PRO — avtomatlashtirilgan prototip (frontend-only)
   Manba: yuklangan Excel dasturi (Этап / sheets) asosida qurilgan.
   Ma'lumotlar window.storage orqali brauzerda saqlanadi (shaxsiy).
   ========================================================= */

/* ---------------- utils ---------------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const nowShift = () => { const h = new Date().getHours(); return (h>=8 && h<20) ? '1' : '2'; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const round2 = (n) => Math.round((num(n))*100)/100;
const safeDiv = (a,b) => { const bb = num(b); return bb ? round2(num(a)/bb) : 0; };
const fmt = (n, d=0) => {
  const v = num(n);
  return v.toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d}).replace(/,/g, ' ');
};
const fmtDate = (s) => { if(!s) return '—'; const p = s.split('-'); return p.length===3 ? `${p[2]}.${p[1]}.${p[0]}` : s; };
const fmtDateTime = (ts) => { if(!ts) return '—'; const d = new Date(ts); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const toast = (msg, kind='ok') => {
  const box = document.createElement('div');
  box.className = 'toastmsg' + (kind==='danger' ? ' danger' : '');
  box.textContent = msg;
  $('#toast').appendChild(box);
  setTimeout(()=>{ box.style.opacity='0'; box.style.transition='opacity .3s'; setTimeout(()=>box.remove(), 300); }, 2600);
};

/* ---------------- confirmation dialog ---------------- */
let CONFIRM_CALLBACK = null;
function askConfirm(message, callback){
  CONFIRM_CALLBACK = callback;
  const msgEl = $('#confirmMsg');
  if(msgEl) msgEl.textContent = message;
  $('#confirmOverlay').style.display = 'flex';
}
function closeConfirm(){
  CONFIRM_CALLBACK = null;
  $('#confirmOverlay').style.display = 'none';
}
function confirmYes(){
  const cb = CONFIRM_CALLBACK;
  closeConfirm();
  if(cb) cb();
}
function confirmDeleteDoc(docType, id){
  askConfirm("Bu hujjatni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.", function(){ deleteDoc(docType, id); });
}
function confirmDeleteProizvodstvo(id){
  askConfirm("Bu hujjatni o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.", function(){ deleteProizvodstvo(id); });
}
function confirmRemoveRef(idx){
  askConfirm("Bu elementni o'chirmoqchimisiz?", function(){ removeRef(idx); });
}

/* ---------------- custom pictogram icons ---------------- */
/* ---------------- SVG icon set (flat, currentColor, dark/light-safe) ---------------- */

function parseCapacityLiters(cap){
  if(!cap) return 0;
  const m = String(cap).match(/(\d+(\.\d+)?)/);
  if(!m) return 0;
  return num(m[1]) * 1000;
}
function deriveSimpleReservoirs(){
  DB.refs.reservoirs = (DB.refs.reservoirCalib.main || []).map(r => {
    const dashName = String(r.number).replace(/^([A-Za-z]+)(\d+)$/, '$1-$2');
    const kind = /^RVS/i.test(r.number) ? 'RVS' : 'RGS';
    const litersCap = parseCapacityLiters(r.capacity);
    const volumeKg = litersCap ? round2(litersCap * num(r.density)) : num(r.netWeightKg);
    return { name: dashName, base: r.base || 'Zirabod', kind, volume: volumeKg };
  });
}

async function loadAuth(){
  try{
    const r = await window.storage.get('authCredentials');
    AUTH = r ? JSON.parse(r.value) : JSON.parse(JSON.stringify(DEFAULT_AUTH));
  }catch(e){ AUTH = JSON.parse(JSON.stringify(DEFAULT_AUTH)); }
  if(!AUTH.admin) AUTH.admin = {...DEFAULT_AUTH.admin};
  if(AUTH.user && !AUTH.users){
    AUTH.users = [{ id:uid(), username:AUTH.user.username, password:AUTH.user.password, fullName:'Foydalanuvchi', shiftPassword:'0000' }];
    delete AUTH.user;
    await persistAuth();
  }
  if(!AUTH.users || !AUTH.users.length) AUTH.users = JSON.parse(JSON.stringify(DEFAULT_AUTH.users));
}
async function persistAuth(){
  try{ await window.storage.set('authCredentials', JSON.stringify(AUTH)); }

}

function attemptLogin(){
  const u = ($('#auth_username')?.value || '').trim();
  const p = $('#auth_password')?.value || '';
  if(SELECTED_ROLE === 'admin'){
    const creds = AUTH.admin;
    if(u === creds.username && p === creds.password){
      CURRENT_ROLE = 'admin'; CURRENT_USER = null;
      enterApp();
      return;
    }
  } else {
    const match = (AUTH.users||[]).find(us => us.username === u && us.password === p);
    if(match){
      CURRENT_ROLE = 'user'; CURRENT_USER = match;
      enterApp();
      return;

  if(err) err.textContent = "Login yoki parol noto'g'ri";

/* ---------------- Smena (shift) tizimi ---------------- */
function monthKeyOf(ts){ const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function getOpenShift(){ return (DB.shifts||[]).find(s => s.closedAt === null) || null; }
function computeNextShiftNumber(){
  const mk = monthKeyOf(Date.now());
  const sameMonth = (DB.shifts||[]).filter(s => s.monthKey === mk);
  return sameMonth.length ? Math.max(...sameMonth.map(s=>s.number)) + 1 : 1;
}
async function openShift(fullName, shiftPassword){
  if(getOpenShift()){ toast('Hozir allaqachon ochiq smena mavjud', 'danger'); return false; }
  if(!CURRENT_USER || shiftPassword !== CURRENT_USER.shiftPassword){ toast("Shaxsiy parol noto'g'ri", 'danger'); return false; }
  if(!fullName.trim()){ toast("F.I.Sh kiriting", 'danger'); return false; }
  const now = Date.now();
  const shift = {
    id: uid(), number: computeNextShiftNumber(), monthKey: monthKeyOf(now),
    personName: fullName.trim(), userId: CURRENT_USER.id,
    openedAt: now, closedAt: null, unlocked: false
  };
  DB.shifts.push(shift);
  await persist('shifts');
  toast(`${shift.number}-Smena ochildi`);
  return true;
}
async function closeCurrentShift(){
  const shift = getOpenShift();
  if(!shift) return;
  shift.closedAt = Date.now();
  await persist('shifts');
  toast(`${shift.number}-Smena yopildi`);
}
async function toggleShiftLock(id){
  const shift = (DB.shifts||[]).find(s=>s.id===id);
  if(!shift) return;
  shift.unlocked = false;
  shift.unlockedUntil = 0;
  await persist('shifts');
  toast('Smena qulflandi');
  renderRoute();
}
/* Smenani ma'lum vaqtga (daqiqa) qayta ochish — Admin ruxsati bilan */
async function unlockShiftFor(id, minutes){
  const shift = (DB.shifts||[]).find(s=>s.id===id);
  if(!shift) return;
  const mins = Math.max(1, num(minutes) || 60);
  shift.unlocked = true;
  shift.unlockedUntil = Date.now() + mins*60000;
  await persist('shifts');
  toast(`${shift.number}-Smena ${mins} daqiqaga tahrirlashga ochildi`);
  renderRoute();
}
/* Smena hozir tahrirlash uchun ochiqmi (vaqt chegarasi bilan) — muddati o'tsa avtomatik qulflanadi */
function isShiftUnlocked(shift){
  return !!(shift && shift.unlockedUntil && shift.unlockedUntil > Date.now());
}
/* Qolgan vaqtni o'qilishi oson formatga o'girish: "1 soat 20 daqiqa" / "35 daqiqa" */
function formatRemaining(ms){
  const totalMin = Math.max(0, Math.ceil(ms/60000));
  const h = Math.floor(totalMin/60), m = totalMin%60;
  if(h>0) return `${h} soat${m>0?' '+m+' daqiqa':''}`;
  return `${m} daqiqa`;
}
function canEditDoc(doc){
  if(isAdmin()) return true;
  if(isGuest()) return false;
  // user role
  if(!doc.shiftId) return true; // legacy docs created before shift system existed
  const openShift = getOpenShift();
  if(openShift && doc.shiftId === openShift.id) return true;
  const shift = (DB.shifts||[]).find(s=>s.id===doc.shiftId);
  return shift ? isShiftUnlocked(shift) : true;
}
/* Admin tomonidan vaqtinchalik qayta ochilgan (yopiq) smenaga User "kirgan" bo'lsa, shu ID saqlanadi */
let REOPENED_SHIFT_ID = null;
/* Hozir ishlash mumkin bo'lgan smena: avval haqiqiy ochiq smena, bo'lmasa — User "kirgan" va hali muddati
   o'tmagan qayta ochilgan yopiq smena. Ikkalasi ham bo'lmasa — null (hujjat kiritib bo'lmaydi). */
function effectiveShiftId(){
  const os = getOpenShift();
  if(os) return os.id;
  if(REOPENED_SHIFT_ID){
    const s = (DB.shifts||[]).find(x=>x.id===REOPENED_SHIFT_ID);
    if(s && isShiftUnlocked(s)) return s.id;
  }
  return null;
}
function hasWorkableShift(){ return !!effectiveShiftId(); }
function effectiveShiftObj(){
  const id = effectiveShiftId();
  return id ? (DB.shifts||[]).find(s=>s.id===id) : null;
}
/* Admin ochib bergan yopiq smenaga "kirish" — shundan keyin yangi hujjatlar shu smenaga yoziladi */
function enterReopenedShift(id){
  const s = (DB.shifts||[]).find(x=>x.id===id);
  if(!s || !isShiftUnlocked(s)){ toast('Bu smenaga kirish muddati tugagan', 'danger'); renderRoute(); return; }
  REOPENED_SHIFT_ID = id;
  toast(`${s.number}-Smenaga kirdingiz — ma'lumot kiritishni davom ettirishingiz mumkin`);
  renderRoute();
}
function exitReopenedShift(){ REOPENED_SHIFT_ID = null; renderRoute(); }

async function saveUserAccount(){
  const fullName = $('#user_new_fullName').value.trim();

  const shiftPassword = $('#user_new_shiftPassword').value.trim();

  const dupUsername = (AUTH.users||[]).some(u => u.username === username && u.id !== USER_EDIT);
  if(dupUsername){ toast('Bunday login band', 'danger'); return; }

    const idx = AUTH.users.findIndex(u=>u.id===USER_EDIT);
    if(idx>-1) AUTH.users[idx] = { id:USER_EDIT, fullName, username, password, shiftPassword, assignedBase };
  } else {
    AUTH.users.push({ id:uid(), fullName, username, password, shiftPassword, assignedBase });

async function loadDB(){
  try{ const r = await window.storage.get('refs'); DB.refs = r ? JSON.parse(r.value) : defaultRefs(); }
  catch(e){ DB.refs = defaultRefs(); }
  try{ const r = await window.storage.get('shifts'); DB.shifts = r ? JSON.parse(r.value) : []; }
  catch(e){ DB.shifts = []; }
  try{ const r = await window.storage.get('docs'); DB.docs = r ? JSON.parse(r.value) : defaultDocs(); }
  catch(e){ DB.docs = defaultDocs(); }
  try{ const r = await window.storage.get('openingBalances'); DB.opening = r ? JSON.parse(r.value) : {}; }
  catch(e){ DB.opening = {}; }
  // ensure all keys exist (in case of future field additions)
  const dd = defaultDocs();
  Object.keys(dd).forEach(k => { if(!DB.docs[k]) DB.docs[k] = []; });
  // one-time migration: replace reservoir list with real RVS/RGS calibration data
  try{
    const migrated = await window.storage.get('reservoirsMigratedV2');
    if(!migrated){
      DB.refs.reservoirs = defaultRefs().reservoirs;
      await window.storage.set('reservoirsMigratedV2', '1');
      await persist('refs');
    }
  }catch(e){}
  // one-time migration: introduce rich reservoir calibration table (Rezervuarlar)
  try{
    const migrated2 = await window.storage.get('reservoirCalibMigratedV1');
    if(!migrated2 || !DB.refs.reservoirCalib){
      DB.refs.reservoirCalib = defaultRefs().reservoirCalib;
      deriveSimpleReservoirs();
      await window.storage.set('reservoirCalibMigratedV1', '1');
      await persist('refs');
    }
  }catch(e){}
  // migration: har bir rezervuar neftbazaga bog'lansin (bo'sh bo'lsa — mavjud birinchi neftbaza)
  try{
    const defBase = (DB.refs.bases && DB.refs.bases[0]) || 'Zirabod';
    let changed = false;
    const cal = DB.refs.reservoirCalib || {main:[],pending:[]};
    ['main','pending'].forEach(t=>{ (cal[t]||[]).forEach(r=>{ if(r && !r.base){ r.base = defBase; changed = true; } }); });
    (DB.refs.reservoirs||[]).forEach(r=>{ if(r && !r.base){ r.base = defBase; changed = true; } });
    if(changed){ deriveSimpleReservoirs(); await persist('refs'); }
  }catch(e){}
  // migration: har bir foydalanuvchi biriktirilgan neftbazaga ega bo'lsin (bo'sh bo'lsa — mavjud birinchi neftbaza)
  try{
    const defBase = (DB.refs.bases && DB.refs.bases[0]) || 'Zirabod';
    let uChanged = false;
    (AUTH.users||[]).forEach(u=>{ if(u && !u.assignedBase){ u.assignedBase = defBase; uChanged = true; } });
    if(uChanged) await persistAuth();
  }catch(e){}
  // migration: eski (muddatsiz) unlocked=true smenalarga vaqt chegarasi biriktiriladi (1 soat)
  try{
    let sChanged = false;
    (DB.shifts||[]).forEach(s=>{
      if(s && s.unlocked && !s.unlockedUntil){ s.unlockedUntil = Date.now() + 60*60000; sChanged = true; }
    });
    if(sChanged) await persist('shifts');
  }catch(e){}
  // one-time migration: convert nomenclature from flat strings to {name} objects
  try{
    if(Array.isArray(DB.refs.nomenclature) && DB.refs.nomenclature.length && typeof DB.refs.nomenclature[0] === 'string'){
      DB.refs.nomenclature = DB.refs.nomenclature.map(n => ({name:n}));
      await persist('refs');
    }
    let needIdFix = false;
    DB.refs.nomenclature = (DB.refs.nomenclature||[]).map(o => {
      if(!o.id){ needIdFix = true; return {...o, id:uid()}; }
      return o;
    });
    if(needIdFix) await persist('refs');
    // Nomenklaturadagi mahsulot turi tasnifi tizimdan olib tashlandi — eski 'type' maydoni tozalanadi
    let typeStrip = false;
    DB.refs.nomenclature = (DB.refs.nomenclature||[]).map(o => {
      if(o && Object.prototype.hasOwnProperty.call(o,'type')){ typeStrip = true; const {type, ...rest} = o; return rest; }
      return o;
    });
    if(typeStrip) await persist('refs');
    // migration: har bir nomenklatura yozuvi neftbazaga biriktirilsin
    // (eski, bazasiz yozuvlar mavjud barcha neftbazalarga nusxalanadi — aks holda ro'yxatda ko'rinmaydi)
    const nomBases = (DB.refs.bases||[]);
    if(nomBases.length && (DB.refs.nomenclature||[]).some(o=>!o.base)){
      const src = DB.refs.nomenclature||[];
      const next = [];
      src.forEach(o=>{
        if(o.base){ next.push(o); return; }
        nomBases.forEach((b,i)=>{
          if(src.some(x=>x.base===b && x.name===o.name)) return;
          if(next.some(x=>x.base===b && x.name===o.name)) return;
          next.push(i===0 ? {...o, base:b} : {...o, id:uid(), base:b});
        });
      });
      DB.refs.nomenclature = next;
      await persist('refs');
    }
    // one-time migration: eski nomlarni yangi nomlarga almashtirish (saqlangan ma'lumotlar uchun ham)
    const NOM_RENAMES = [
      ['Pryamogon benzin', "To'g'ridan-to'g'ri ishlaydigan ekstraksiya benzini"],
      ['Nesabilniy uglevodorod PYG', 'Beqaror uglevodorod PYG'],
      ['Nesabilniy uglevodorod PYG (Eron)', 'Beqaror uglevodorod PYG (Eron)']
    ];
    for(const [oldNom, newNom] of NOM_RENAMES){
      const hits = (DB.refs.nomenclature||[]).filter(o=>o.name===oldNom);
      for(const rec of hits){
        rec.name = newNom;
        await renameNomenclatureEverywhere(rec.base, oldNom, newNom);
      }
      // kalibrovka jadvallarida nomenklaturaga bog'lanmagan eski yozuvlar ham tozalansin
      Object.keys(DB.refs.reservoirCalib||{}).forEach(tb=>{
        (DB.refs.reservoirCalib[tb]||[]).forEach(r=>{ if(r && r.productName===oldNom) r.productName = newNom; });
      });
      if(hits.length) await persist('refs');
    }
  }catch(e){}
  // one-time migration: convert organizations/contractors from flat strings to {name,inn} objects
  try{
    let orgFix = false;
    ['organizations','contractors'].forEach(tab => {
      if(Array.isArray(DB.refs[tab]) && DB.refs[tab].length && typeof DB.refs[tab][0] === 'string'){
        DB.refs[tab] = DB.refs[tab].map(n => ({id:uid(), name:n, inn:''}));
        orgFix = true;
      } else {
        DB.refs[tab] = (DB.refs[tab]||[]).map(o => {
          if(!o.id){ orgFix = true; return {...o, id:uid(), inn: o.inn||''}; }
          if(o.inn === undefined){ orgFix = true; return {...o, inn:''}; }
          return o;
        });
      }
    });
    if(orgFix) await persist('refs');
  }catch(e){}
  // one-time migration: ensure regions (viloyatlar) reference list exists
  try{
    if(!DB.refs.regions || !DB.refs.regions.length){
      DB.refs.regions = defaultRefs().regions;
      await persist('refs');
    }
  }catch(e){}
  // Markazlashgan Movement Ledger — hujjatlardan avtomatik quriladi (yagona haqiqat manbai)
  rebuildLedger();
  DB.ready = true;
}
async function persist(part){
  try{
    if(part==='refs') await window.storage.set('refs', JSON.stringify(DB.refs));
    if(part==='docs') await window.storage.set('docs', JSON.stringify(DB.docs));
    if(part==='opening') await window.storage.set('openingBalances', JSON.stringify(DB.opening));
    if(part==='shifts') await window.storage.set('shifts', JSON.stringify(DB.shifts));
    if(part==='movements') await window.storage.set('movements', JSON.stringify(DB.movements||[]));
  }catch(e){ console.error('storage error', e); toast('Saqlashda xatolik yuz berdi', 'danger'); }
}

function getNormPercent(nomenclature){
  const item = (DB.refs.normPotr || []).find(n => n.nomenclature === nomenclature);
  return item ? num(item.percent) : 0;

function refOptionsHtml(key, selected){
  const def = REF_DEFS[key];
  const items = refList(key);
  let opts = '<option value="">— tanlang —</option>';
  if(def.type === 'flat'){
    items.forEach(v => { opts += `<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`; });
  } else {
    items.forEach(o => {
      const val = o[def.display];
      const extra = key==='reservoirs' ? ` · ${esc(o.base)} (${esc(o.kind)})` : (key==='nomenclature' ? '' : (o.org ? ` · ${esc(o.org)}` : ''));
      opts += `<option value="${esc(val)}" ${val===selected?'selected':''}>${esc(val)}${extra}</option>`;
    });
  }
  return opts;
}

/* ---------------- field DSL ---------------- */
function F(key,label,type,opts={}){ return Object.assign({key,label,type}, opts); }

/* Rezervuar dropdowni — tanlangan neftbaza bo'yicha filtrlangan ro'yxat.
   Neftbaza tanlanmagan bo'lsa — bo'sh (disabled) va "Avval Neftbazani tanlang". */
let FORM_BASE_CTX = '';
let FORM_RESERVOIR_CTX = '';
function reservoirOptionsHtml(base, selected){
  if(!base) return `<option value="">Avval Neftbazani tanlang</option>`;
  const items = refList('reservoirs').filter(o => o.base === base);
  let opts = '<option value="">— tanlang —</option>';
  items.forEach(o => { opts += `<option value="${esc(o.name)}" ${o.name===selected?'selected':''}>${esc(o.name)}${o.kind?` (${esc(o.kind)})`:''}</option>`; });
  return opts;
}
/* Nomenklatura — Neftbaza VA Rezervuar ikkalasi tanlangandan keyingina faollashadi */
function nomenclatureOptionsHtml(base, reservoir, selected){
  if(!base || !reservoir) return `<option value="">Avval Neftbaza va Rezervuarni tanlang</option>`;
  return refOptionsHtml('nomenclature', selected||'');
}
/* Neftbaza o'zgarganda: Rezervuar tozalanadi/qayta filtrlanadi, Nomenklatura ham tozalanib disabled bo'ladi */
function onDocBaseChange(docType){
  const baseSel = document.getElementById(`f_${docType}_base`);
  const resSel = document.getElementById(`f_${docType}_reservoir`);
  const base = baseSel ? baseSel.value : '';
  if(resSel){
    resSel.innerHTML = reservoirOptionsHtml(base, '');
    resSel.value = '';
    resSel.disabled = !base;
  }
  onDocReservoirChange(docType);
}
/* Rezervuar o'zgarganda: Nomenklatura tozalanadi va Neftbaza+Rezervuar tanlanmaguncha disabled bo'ladi */
function onDocReservoirChange(docType){
  const baseSel = document.getElementById(`f_${docType}_base`);
  const resSel = document.getElementById(`f_${docType}_reservoir`);
  const nomEl = document.getElementById(`f_${docType}_nomenclature`);
  if(!nomEl) return;
  const base = baseSel ? baseSel.value : '';
  const res = resSel ? resSel.value : '';
  const gated = !(base && res);
  nomEl.value = '';
  nomEl.disabled = gated;
  if(nomEl.tagName === 'SELECT'){
    nomEl.innerHTML = nomenclatureOptionsHtml(base, res, '');
  } else {
    nomEl.placeholder = gated ? 'Avval Neftbaza va Rezervuarni tanlang' : 'Qidirish uchun yozing…';
  }
}

/* ---------------- generic field renderer ---------------- */
function fieldHtml(docType, f, currentVal){
  const id = `f_${docType}_${f.key}`;
  const val = (currentVal !== undefined && currentVal !== null && currentVal !== '') ? currentVal : f.def;
  const wideClass = (f.type==='textarea') ? ' wide' : '';
  let inner = '';
  if(f.key === 'smena'){
    const effShift = effectiveShiftObj();
    const shiftVal = currentVal || (effShift ? effShift.number : (val||''));
    if(isUser()){
      inner = `<input type="text" id="${id}" value="${esc(shiftVal)}" readonly style="opacity:.75;cursor:not-allowed;">`;
    } else {
      inner = `<input type="text" id="${id}" value="${esc(shiftVal)}">`;
    }
  } else if(f.key==='nomenclature' && f.ref==='nomenclature'){
    const base = FORM_BASE_CTX || '';
    const res = FORM_RESERVOIR_CTX || '';
    const gated = !(base && res);
    if(f.type==='autocomplete'){
      inner = `<input type="text" id="${id}" list="dl_${id}" placeholder="${gated ? 'Avval Neftbaza va Rezervuarni tanlang' : 'Qidirish uchun yozing…'}" value="${val?esc(val):''}" autocomplete="off" ${gated?'disabled':''}>
        <datalist id="dl_${id}">${refDatalistHtml(f.ref)}</datalist>`;
    } else {
      inner = `<select id="${id}" ${gated?'disabled':''}>${nomenclatureOptionsHtml(base, res, val||'')}</select>`;
    }
  } else if(f.type==='autocomplete' && f.ref){
    inner = `<input type="text" id="${id}" list="dl_${id}" placeholder="Qidirish uchun yozing…" value="${val?esc(val):''}" autocomplete="off">
      <datalist id="dl_${id}">${refDatalistHtml(f.ref)}</datalist>`;
  } else if(f.key==='reservoir' && f.ref==='reservoirs'){
    const base = FORM_BASE_CTX || '';
    inner = `<select id="${id}" ${base?'':'disabled'} onchange="onDocReservoirChange('${docType}')">${reservoirOptionsHtml(base, val||'')}</select>`;
  } else if(f.key==='base' && f.ref==='bases'){
    inner = `<select id="${id}" onchange="onDocBaseChange('${docType}')">${refOptionsHtml('bases', val||'')}</select>`;
  } else if(f.type==='select' && f.ref){
    inner = `<select id="${id}">${refOptionsHtml(f.ref, val||'')}</select>`;
  } else if(f.type==='select' && f.options){
    inner = `<select id="${id}">` + f.options.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(o)}</option>`).join('') + `</select>`;
  } else if(f.type==='textarea'){
    inner = `<textarea id="${id}" placeholder="${esc(f.placeholder||'')}">${esc(val||'')}</textarea>`;
  } else if(f.type==='number'){
    inner = `<input type="number" id="${id}" step="${f.step||'any'}" placeholder="0" value="${val!=null?esc(val):''}">`;
  } else if(f.type==='date'){
    inner = `<input type="date" id="${id}" value="${val?esc(val):''}">`;
  } else {
    inner = `<input type="text" id="${id}" placeholder="${esc(f.placeholder||'')}" value="${val?esc(val):''}" ${f.readonly?'readonly style="opacity:.75;cursor:not-allowed;"':''}>`;
  }
  return `<div class="field${wideClass}"><label>${esc(f.label)}${f.required?' <span class="req">*</span>':''}</label>${inner}</div>`;
}
function refDatalistHtml(key){
  const def = REF_DEFS[key];
  const items = refList(key);
  if(def.type === 'flat'){
    return items.map(v => `<option value="${esc(v)}">`).join('');
  }
  return items.map(o => `<option value="${esc(o[def.display])}">`).join('');
}

        <div class="stat in"><div class="lbl">Qabul qilingan, kg</div><div class="val"><span id="av_acc">0</span><small>kg</small></div></div>
      </div>
      <div id="av_capacity_warning" style="display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--danger-dim);color:var(--danger);font-size:13px;font-weight:600;"></div>
    </div>`;

function recalcAvtoPreview(docType){
  const get = k => num(document.getElementById(`f_${docType}_${k}`)?.value);
  const nomEl = document.getElementById(`f_${docType}_nomenclature`);
  const docKg = get('docKg'), factKg = get('factKg');
  const diff = round2(factKg - docKg);
  const pct = getNormPercent(nomEl ? nomEl.value : '');
  const toleranceKg = round2(docKg * pct / 100);
  const ns = Math.abs(diff) <= toleranceKg ? 0 : round2(diff - Math.sign(diff)*toleranceKg);
  const shortage = ns < 0 ? Math.abs(ns) : 0;
  const surplus = ns > 0 ? ns : 0;
  const acc = ns === 0 ? round2(docKg) : round2(factKg);
  const set = (id,v) => { const el = document.getElementById(id); if(el) el.textContent = fmt(v,1); };
  const setSigned = (id,v) => { const el = document.getElementById(id); if(el) el.textContent = (v>0?'+':'') + fmt(v,1); };
  set('av_short', shortage); set('av_surplus', surplus); set('av_acc', acc);
  const warnEl = document.getElementById('av_capacity_warning');
  if(warnEl){
    const baseEl = document.getElementById(`f_${docType}_base`);
    const resEl = document.getElementById(`f_${docType}_reservoir`);
    const editId = EDITING_ID ? EDITING_ID[docType] : null;
    const check = (baseEl && resEl && baseEl.value && resEl.value) ? checkReservoirCapacity(docType, baseEl.value, resEl.value, acc, editId) : {ok:true};
    if(!check.ok){
      warnEl.style.display = 'block';
      warnEl.textContent = `Rezervuar sig'imi yetarli emas! Bo'sh joy: ${fmt(check.available,1)} kg (sig'im: ${fmt(check.volume,0)} kg)`;
    } else {
      warnEl.style.display = 'none';
    }
  }
}

function getFieldValue(docType, f){

}

async function saveDoc(docType){
  const cfg = DOC_TYPES[docType];
  const editId = EDITING_ID[docType];
  const existing = editId ? DB.docs[docType].find(d => d.id === editId) : null;
  if(existing && !canEditDoc(existing)){ toast("Bu hujjatni tahrirlashga ruxsatingiz yo'q (smena yopilgan)", 'danger'); return; }
  if(!existing && isUser() && !hasWorkableShift()){ toast("Avval smenani oching", 'danger'); return; }
  const obj = { id: editId || uid(), createdAt: existing ? existing.createdAt : Date.now() };
  let missing = [];
  cfg.sections.forEach(sec => sec.fields.forEach(f => {
    const v = getFieldValue(docType, f);
    obj[f.key] = v;
    if(f.required && !v) missing.push(f.label);
  }));
  if(missing.length){ toast(`To'ldiring: ${missing.join(', ')}`, 'danger'); return; }
  if(cfg.onSave) cfg.onSave(obj);
  if(docType === 'prihodAvto' && obj.reservoir && obj.base && obj.cargoStatus !== "Yo'lda"){
    const check = checkReservoirCapacity(docType, obj.base, obj.reservoir, num(obj.accepted), editId);
    if(!check.ok){
      toast(`Rezervuar sig'imi yetarli emas! Bo'sh joy: ${fmt(check.available,1)} kg (sig'im: ${fmt(check.volume,0)} kg, hozirgi qoldiq: ${fmt(check.balance,1)} kg)`, 'danger');
      return;
    }
  }
  if(existing){
    obj.shiftId = existing.shiftId;
    obj.createdBy = existing.createdBy || docAuthor(existing);
  } else {
    if(isUser()){
      obj.shiftId = effectiveShiftId();
    }
    obj.createdBy = currentAuthorName();
  }
  if(existing){
    const idx = DB.docs[docType].findIndex(d => d.id === editId);
    DB.docs[docType][idx] = obj;
  } else {
    DB.docs[docType].push(obj);
  }
  await persist('docs');
  await syncLedger();
  toast(existing ? 'Hujjat yangilandi' : 'Hujjat saqlandi');
  EDITING_ID[docType] = null;
  DOC_VIEW_MODE[docType] = 'journal';
  renderRoute();
}

async function deleteDoc(docType, id){
  if(isGuest()){ toast("Mehmon sifatida faqat ko'rish mumkin", 'danger'); return; }
  const rec = DB.docs[docType].find(d=>d.id===id);
  if(rec && !canEditDoc(rec)){ toast("Bu hujjat qulflangan smenaga tegishli — faqat admin ruxsat bersa o'chirish mumkin", 'danger'); return; }
  DB.docs[docType] = DB.docs[docType].filter(d => d.id !== id);
  await persist('docs');
  await syncLedger();
  toast("O'chirildi", 'danger');
  renderRoute();
}

function cellValue(docType, row, col){
  if(col==='diff' || col==='shortageSurplus'){
    const v = row[col];
    const cls = v>0?'pos':(v<0?'neg':'');
    return `<span class="num ${cls}">${v>0?'+':''}${fmt(v,1)}</span>`;
  }
  if(col==='normPercent') return `<span class="num">${fmt(row.normPercent,2)}%</span>`;
  if(col==='opDate') return fmtDate(row.opDate);
  if(col==='createdAt') return `<span class="num" style="white-space:nowrap;">${fmtDateTime(row.createdAt)}</span>`;
  if(col==='smena') return row.smena ? `<span class="badge-num">${esc(row.smena)}-Smena</span>` : '—';
  if(['docKg','factKg','kg','invNetKg','netKg','oprihodovano','normPoteri','accepted'].includes(col)) return `<span class="num">${fmt(row[col],1)}</span>`;
  return esc(row[col] ?? '—') || '—';
}

const KG_LITER_SYNC_MAP = {
  prihodAvto: { prefixes:['doc','fact'], divisor:1 },
  rashodAvto: { prefixes:['doc'], divisor:1 },
  izlishka: { prefixes:[''], divisor:1 },
  spisaniya: { prefixes:[''], divisor:1 },
  sUstanovki: { prefixes:[''], divisor:1 },
  vUstanovku: { prefixes:[''], divisor:1 },
  rashodVagon: { prefixes:[''], divisor:1, kgKey:'netKg' },
  prihodVagon: { prefixes:[''], divisor:1, kgKey:'netKg' }
};
function wireKgLiterSync(docType, cfg){
  const form = document.getElementById(`form_${docType}`);
  if(!form) return;
  const { prefixes, divisor, kgKey } = cfg;
  form.addEventListener('input', (e) => {
    const id = e.target.id;
    prefixes.forEach(p => {
      const kgId = p ? `f_${docType}_${p}${kgKey?(kgKey[0].toUpperCase()+kgKey.slice(1)):'Kg'}` : `f_${docType}_${kgKey||'kg'}`;
      const densId = p ? `f_${docType}_${p}Density` : `f_${docType}_density`;
      const litId = p ? `f_${docType}_${p}Liter` : `f_${docType}_liter`;
      const kgEl = document.getElementById(kgId), densEl = document.getElementById(densId), litEl = document.getElementById(litId);
      if(!kgEl || !densEl || !litEl) return;
      if(id !== kgId && id !== densId && id !== litId) return;

      // the field the user just typed into is always "real" (user-provided), never auto
      e.target.dataset.auto = '';

      const setAuto = (el, val) => { el.value = val; el.dataset.auto = '1'; };
      const kg = num(kgEl.value), dens = num(densEl.value), lit = num(litEl.value);
      const kgReal = kg > 0 && kgEl.dataset.auto !== '1';
      const litReal = lit > 0 && litEl.dataset.auto !== '1';
      const densReal = dens > 0 && densEl.dataset.auto !== '1';

      if(id === kgId){
        if(litReal) setAuto(densEl, round2(kg * divisor / lit));
        else if(densReal) setAuto(litEl, round2(kg * divisor / dens));
      } else if(id === litId){
        if(densReal) setAuto(kgEl, round2(lit * dens / divisor));
        else if(kgReal) setAuto(densEl, round2(kg * divisor / lit));
      } else if(id === densId){
        if(litReal) setAuto(kgEl, round2(lit * dens / divisor));
        else if(kgReal) setAuto(litEl, round2(kg * divisor / dens));
      }
    });
  });
}
function renderDocPage(docType){
  const mode = DOC_VIEW_MODE[docType] || 'journal';
  if(mode !== 'form') return renderDocTable(docType);
  const html = renderDocForm(docType);
  if(KG_LITER_SYNC_MAP[docType]){
    setTimeout(() => wireKgLiterSync(docType, KG_LITER_SYNC_MAP[docType]), 0);

function prodResetItems(record){
  if(record){

      spent: record.spent && record.spent.length ? record.spent.map(it=>({id:uid(), ...it})) : [{id:uid()}],
      received: record.received && record.received.length
        ? record.received.map(it=>({id:uid(), ...it}))
        : [{id:uid()}]
    };
  } else {
    PROD_ITEMS = { spent:[{id:uid()}], received:[{id:uid()}] };
  }
}
function nomOptionsAll(selected){
  let opts = '<option value="">— tanlang —</option>';
  (DB.refs.nomenclature||[]).forEach(o=>{
    opts += `<option value="${esc(o.name)}" ${o.name===selected?'selected':''}>${esc(o.name)}</option>`;
  });
  return opts;
}
function prodItemRow(kind, item, idx){
  const nomOpts = nomOptionsAll(item.nomenclature);
  const percentField = `
      <div class="field"><label>${idx===0?'%':''}</label>
        <input type="number" step="any" value="${item.percent||''}" oninput="prodUpdate('${kind}','${item.id}','percent',this.value)"></div>`;
  return `
    <div class="itemsrow ${kind==='received'?'itemsrow-received':''}" data-kind="${kind}" data-id="${item.id}">
      <div class="field"><label>${idx===0?'Nomenklatura':''}</label>
        <select onchange="prodUpdate('${kind}','${item.id}','nomenclature',this.value)">${nomOpts}</select>
      </div>
      ${percentField}
      <div class="field"><label>${idx===0?'Kg':''}</label>
        <input type="number" step="any" id="prodkg_${kind}_${item.id}" value="${item.kg||''}" oninput="prodUpdate('${kind}','${item.id}','kg',this.value)"></div>
      <div class="field"><label>${idx===0?'Zichlik, kg/l':''}</label>
        <input type="number" step="any" id="proddens_${kind}_${item.id}" value="${item.density||''}" oninput="prodUpdate('${kind}','${item.id}','density',this.value)"></div>
      <div class="field"><label>${idx===0?'Litr':''}</label>
        <input type="number" step="any" id="prodlit_${kind}_${item.id}" value="${item.liter||''}" oninput="prodUpdate('${kind}','${item.id}','liter',this.value)"></div>
      <button type="button" class="btn sm danger icon" onclick="prodRemoveRow('${kind}','${item.id}')" title="Qatorni o'chirish">${ICON_CLOSE}</button>
    </div>`;
}
function prodUpdate(kind, id, key, val){
  const arr = PROD_ITEMS[kind];
  const it = arr.find(x=>x.id===id);
  if(!it) return;
  it[key] = val;
  if(key === 'liter' || key === 'density'){
    const dens = num(it.density), lit = num(it.liter);
    if(dens > 0 && lit > 0){
      it.kg = round2(lit * dens);
      const kgInput = document.getElementById(`prodkg_${kind}_${id}`);
      if(kgInput) kgInput.value = it.kg;
    }
  }
  updateProdTotals();
}
function prodAddRow(kind){
  PROD_ITEMS[kind].push({id:uid()});
  renderProdItemsUI();
}
function prodRemoveRow(kind, id){
  PROD_ITEMS[kind] = PROD_ITEMS[kind].filter(x=>x.id!==id);
  if(!PROD_ITEMS[kind].length) PROD_ITEMS[kind].push({id:uid()});
  renderProdItemsUI();
}
function prodItemsTotal(kind){ return PROD_ITEMS[kind].reduce((s,it)=>s+num(it.kg),0); }
function prodSpentSums(){
  const items = PROD_ITEMS.spent || [];
  const kg = items.reduce((s,it)=>s+num(it.kg),0);
  const liter = items.reduce((s,it)=>s+num(it.liter),0);
  // O'rtacha zichlik — og'irlik bo'yicha (aralashma zichligi): jami kg / jami litr
  const dens = liter > 0 ? kg / liter : 0;
  return { kg, liter, dens };
}
function updateProdTotals(){
  const sT = $('#prod_spent_total'), rT = $('#prod_received_total'), lT = $('#prod_loss_total');
  if(sT) sT.textContent = fmt(prodItemsTotal('spent'),1);
  if(rT) rT.textContent = fmt(prodItemsTotal('received'),1);
  if(lT) lT.textContent = fmt(prodItemsTotal('spent')-prodItemsTotal('received'),1);
  const s = prodSpentSums();
  const setTxt = (sel,v,dec) => { const el = $(sel); if(el) el.textContent = fmt(v,dec); };
  setTxt('#prod_spent_sum_kg', s.kg, 1);
  setTxt('#prod_spent_sum_dens', s.dens, 4);
  setTxt('#prod_spent_sum_liter', s.liter, 1);
}
function renderProdItemsUI(){
  const spentHost = $('#prod_spent_rows'); const recvHost = $('#prod_received_rows');
  if(spentHost) spentHost.innerHTML = PROD_ITEMS.spent.map((it,i)=>prodItemRow('spent',it,i)).join('');
  if(recvHost) recvHost.innerHTML = PROD_ITEMS.received.map((it,i)=>prodItemRow('received',it,i)).join('');
  updateProdTotals();
}

/* ---------------- Hisobot: Moddiy otchyot ---------------- */
let MO_STATE = { base:'', smena:'', from:'', to:'', generated:false };
function inRange(d, from, to){ return (!from || d.opDate>=from) && (!to || d.opDate<=to); }
/* =========================================================================
   MARKAZLASHGAN HARAKAT JURNALI (Movement Ledger)
   Har bir saqlangan hujjat avtomatik ravishda harakat yozuvi(lari)ni hosil qiladi.
   Moddiy hisobot faqat shu jurnaldan hisoblanadi (qo'lda hisob yo'q).
   ========================================================================= */
const fmtTime = (ts) => { if(!ts) return '—'; const d = new Date(ts); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function nomId(name){ const o = (DB.refs?.nomenclature||[]).find(x=>x.name===name); return o ? o.id : ''; }

/* Har bir hujjat turining harakatga o'girilish qoidasi */
const MOVEMENT_MAP = {
  prihodAvto:  {op:'IN',  cat:'avto',         bucket:'avto',     qty:'accepted',    net:d=>d.factKg||d.docKg,  density:d=>d.factDensity||d.docDensity, temp:()=>'',    vehicle:d=>d.driver||d.autoNum, docNum:d=>d.ttn,   transit:d=>d.cargoStatus==="Yo'lda"},
  rashodAvto:  {op:'OUT', cat:'avto',         bucket:'avto',     qty:'docKg',       net:d=>d.docKg,            density:d=>d.docDensity,                temp:()=>'',    vehicle:d=>d.driver||d.autoNum, docNum:d=>d.ttn},
  prihodVagon: {op:'IN',  cat:'vagon',        bucket:'vagon',    qty:'oprihodovano',net:d=>d.netKg||d.invNetKg,density:d=>d.density,                   temp:d=>d.temp, vehicle:d=>d.vagonNum,          docNum:d=>d.invNum, gross:d=>d.tara, transit:d=>d.status==="Yo'lda"},
  rashodVagon: {op:'OUT', cat:'vagon',        bucket:'vagon',    qty:'netKg',       net:d=>d.netKg,            density:d=>d.density,                   temp:d=>d.temp, vehicle:d=>d.vagonNum,          docNum:d=>d.invNum, gross:d=>d.tara},
  sUstanovki:  {op:'IN',  cat:'installation', bucket:'qurilma',  qty:'kg',          net:d=>d.kg,               density:d=>d.density,                   temp:d=>d.temp, docNum:d=>d.docNum},
  vUstanovku:  {op:'OUT', cat:'installation', bucket:'qurilma',  qty:'kg',          net:d=>d.kg,               density:d=>d.density,                   temp:d=>d.temp, docNum:d=>d.docNum},
  izlishka:    {op:'IN',  cat:'adjustment',   bucket:'ortiqcha', qty:'kg',          net:d=>d.kg,               density:d=>d.density,                   temp:d=>d.temp, docNum:d=>d.docNum},
  spisaniya:   {op:'OUT', cat:'adjustment',   bucket:'kamomad',  qty:'kg',          net:d=>d.kg,               density:d=>d.density,                   temp:d=>d.temp, docNum:d=>d.docNum},
};

/* Bitta oddiy hujjatdan bitta harakat yozuvi */
function createMovement(doc, docType){
  const map = MOVEMENT_MAP[docType]; if(!map) return null;
  const cfg = DOC_TYPES[docType] || {};
  const tv = map.temp ? map.temp(doc) : '';
  return {
    id: 'mv_' + doc.id,
    sourceDocId: doc.id, sourceDocType: docType,
    date: doc.opDate || '', time: fmtTime(doc.createdAt), createdAt: doc.createdAt || 0,
    productId: nomId(doc.nomenclature), productName: doc.nomenclature || '',
    operation: map.op, sourceModule: cfg.title || docType, category: map.cat, bucket: map.bucket,
    quantity: round2(num(doc[map.qty])),
    density: map.density ? num(map.density(doc)) : 0,
    temp: (tv===''||tv==null) ? '' : num(tv),
    netWeight: map.net ? round2(num(map.net(doc))) : 0,
    grossWeight: map.gross ? round2(num(map.gross(doc))) : 0,
    tank: doc.reservoir || '', organization: doc.organization || '',
    vehicle: map.vehicle ? (map.vehicle(doc)||'') : '',
    user: doc.createdBy || '', docNumber: map.docNum ? (map.docNum(doc)||'') : '',
    notes: doc.note || '', base: doc.base || '', smena: doc.smena || '',
    transit: map.transit ? !!map.transit(doc) : false
  };
}

/* Ishlab chiqarish hujjati — har bir komponent/mahsulot uchun alohida harakat */
function prodMovement(doc, it, op, idx, rawSelf){
  return {
    id: 'mv_'+doc.id+'_'+op+idx,
    sourceDocId: doc.id, sourceDocType: 'proizvodstvo',
    date: doc.opDate || '', time: fmtTime(doc.createdAt), createdAt: doc.createdAt || 0,
    productId: nomId(it.nomenclature), productName: it.nomenclature || '',
    operation: op, sourceModule: 'Ishlab chiqarish', category: 'proizvodstvo', bucket: 'proizvodstvo',
    quantity: round2(num(it.kg)), density: num(it.density), temp: '',
    netWeight: round2(num(it.kg)), grossWeight: 0,
    tank: doc.reservoir || '', organization: doc.organization || '', vehicle: '',
    user: doc.createdBy || '', docNumber: doc.docNum || '', notes: doc.note || '',
    base: doc.base || '', smena: doc.smena || '', transit: false, rawSelf: !!rawSelf
  };
}
function createProductionMovements(doc){
  const list = [];
  const spentNoms = (doc.spent||[]).map(it=>it.nomenclature);
  (doc.spent||[]).forEach((it,i)=>{ if(it.nomenclature) list.push(prodMovement(doc, it, 'OUT', i, false)); });
  (doc.received||[]).forEach((it,i)=>{
    if(!it.nomenclature) return;
    // sarflangan komponentdan qayta olingan mahsulot — hisobot KIRIMiga qo'shilmaydi (parity bilan matOtchet)
    const rawSelf = spentNoms.includes(it.nomenclature);
    list.push(prodMovement(doc, it, 'IN', i, rawSelf));
  });
  return list;
}

/* Butun jurnalni hujjatlardan qayta quramiz (tahrir/o'chirishda ham izchil) */
function buildAllMovements(){
  const out = [];
  Object.keys(MOVEMENT_MAP).forEach(dt=>{
    (DB.docs[dt]||[]).forEach(doc=>{ const m = createMovement(doc, dt); if(m) out.push(m); });
  });
  (DB.docs.proizvodstvo||[]).forEach(doc=>{ createProductionMovements(doc).forEach(m=>out.push(m)); });
  return out;
}
function rebuildLedger(){ DB.movements = buildAllMovements(); }
async function syncLedger(){ rebuildLedger(); await persist('movements'); }

/* Yo'ldagi (transit) qoldiq — jurnaldan */
function transitBalance(base, nom, cutoffDate, strictBefore){
  let bal = 0;
  (DB.movements||[]).forEach(m=>{
    if(!m.transit || m.base!==base || m.productName!==nom) return;
    if(cutoffDate){ if(strictBefore ? !(m.date<cutoffDate) : !(m.date<=cutoffDate)) return; }
    bal += num(m.quantity);
  });
  return round2(bal);
}

/* Moddiy hisobot — faqat harakat jurnalidan hisoblanadi */
function calculateMaterialReport(base, smena, from, to){
  return refList('nomenclature').map(o=>o.name).map(nom=>{
    const key = base+'|'+nom;
    const begin = num(DB.opening[key]);
    const beginTransit = from ? transitBalance(base, nom, from, true) : 0;
    const endTransit = transitBalance(base, nom, to || null, false);
    const inB  = { avto:0, vagon:0, proizvodstvo:0, qurilma:0, ortiqcha:0 };
    const outB = { avto:0, vagon:0, proizvodstvo:0, qurilma:0, kamomad:0 };
    (DB.movements||[]).forEach(m=>{
      if(m.base!==base || m.productName!==nom) return;
      if(!inRange({opDate:m.date}, from, to)) return;
      if(smena && String(m.smena)!==String(smena)) return;
      if(m.operation==='IN'){
        if(m.rawSelf) return;
        if(inB[m.bucket]!=null) inB[m.bucket] += num(m.quantity);
      } else {
        if(outB[m.bucket]!=null) outB[m.bucket] += num(m.quantity);
      }
    });
    const totalIn  = Object.values(inB).reduce((a,b)=>a+b,0);
    const totalOut = Object.values(outB).reduce((a,b)=>a+b,0);
    return { nom, begin, beginTransit, inB, totalIn, outB, totalOut, end: round2(begin+totalIn-totalOut), endTransit };
  });
}
/* Orqaga moslik: eski chaqiruvlar ishlashi uchun */
function matOtchetData(base, smena, from, to){ return calculateMaterialReport(base, smena, from, to); }

function closeMovementHistory(){ const r = document.getElementById('mvhRoot'); if(r) r.innerHTML=''; MVH_STATE=null; }

function mvhToggleSort(){ if(!MVH_STATE) return; MVH_STATE.sortDir = MVH_STATE.sortDir==='desc'?'asc':'desc'; const b=document.getElementById('mvhSortBtn'); if(b) b.textContent = 'Sana '+(MVH_STATE.sortDir==='desc'?'↓':'↑'); mvhRender(); }
function mvhRender(){
  const s = MVH_STATE; if(!s) return;
  let list = movementsForProduct(s.product).filter(m=>{
    if(s.from && !(m.date>=s.from)) return false;
    if(s.to && !(m.date<=s.to)) return false;
    if(s.op && m.operation!==s.op) return false;
    if(s.org && m.organization!==s.org) return false;
    if(s.module && m.sourceModule!==s.module) return false;
    if(s.search){
      const q = s.search.toLowerCase();
      const hay = [m.docNumber,m.notes,m.tank,m.organization,m.vehicle,m.user,m.sourceModule].map(x=>String(x||'').toLowerCase()).join(' ');
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  list.sort((a,b)=>{
    const av = (a.date||'')+' '+(a.time||''), bv = (b.date||'')+' '+(b.time||'');
    const c = av<bv?-1:(av>bv?1:(a.createdAt-b.createdAt));
    return s.sortDir==='desc' ? -c : c;
  });
  const body = document.getElementById('mvhBody');
  if(!body) return;
  body.innerHTML = list.length ? list.map(m=>`
    <tr class="${m.operation==='IN'?'mvh-in':'mvh-out'}">

    </tr>`).join('') : `<tr class="emptyrow"><td colspan="13">Ushbu mahsulot bo'yicha harakat topilmadi</td></tr>`;
  const cnt = document.getElementById('mvhCount');
  if(cnt){
    const tin = list.filter(m=>m.operation==='IN').reduce((a,m)=>a+num(m.quantity),0);
    const tout = list.filter(m=>m.operation==='OUT').reduce((a,m)=>a+num(m.quantity),0);
    cnt.innerHTML = `Jami <b>${list.length}</b> ta harakat &nbsp;·&nbsp; <span style="color:var(--success)">Kirim: ${fmt(tin,1)} kg</span> &nbsp;·&nbsp; <span style="color:var(--danger)">Chiqim: ${fmt(tout,1)} kg</span>`;
  }
}

const MO_COL_LABELS = ["№","Mahsulot","Boshlang'ich yo'ldagi qoldiq","Boshlang'ich qoldiq","Jami kirim","Avto (kirim)","Vagon (kirim)","Ishlab chiqarish (kirim)","Qurilmadan qabul","Ortiqcha","Jami chiqim","Avto (chiqim)","Vagon (chiqim)","Ishlab chiqarish (chiqim)","Qurilmaga berildi","Hisobdan chiqarish","Yakuniy qoldiq","Yakuniy yo'ldagi qoldiq"];
function moRowsAsArrays(){
  if(!MO_LAST_REPORT) return [];
  return MO_LAST_REPORT.shown.map((r,i)=>[
    i+1, r.nom, r.beginTransit, r.begin, r.totalIn, r.inB.avto, r.inB.vagon, r.inB.proizvodstvo, r.inB.qurilma, r.inB.ortiqcha,
    r.totalOut, r.outB.avto, r.outB.vagon, r.outB.proizvodstvo, r.outB.qurilma, r.outB.kamomad, r.end, r.endTransit
  ]);
}
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function moExportExcel(){
  if(!MO_LAST_REPORT){ toast("Avval hisobotni ko'rsating", 'danger'); return; }
  const rows = [MO_COL_LABELS, ...moRowsAsArrays()];
  const csv = rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return /[",;\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(';')).join('\r\n');
  downloadBlob('\uFEFF'+csv, `Moddiy_hisobot_${MO_LAST_REPORT.base}_${today()}.csv`, 'text/csv;charset=utf-8;');
  toast('Excel fayli yuklandi');
}
function moBuildPrintHtml(){
